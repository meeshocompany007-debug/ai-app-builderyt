<script>
if (location.protocol.startsWith('http')) fetch('/api/status').then(r=>r.json()).then(s=>{if(typeof s.signedIn==='boolean')document.querySelector('#workspaceLink').hidden=false}).catch(()=>{});
const studio = document.querySelector('#studio');
const idea = document.querySelector('#idea');
const review = document.querySelector('#review');
const heading = document.querySelector('#heading');
studio.addEventListener('change', () => {
  idea.placeholder = studio.elements.kind.value === 'Website'
    ? 'जैसे मेरी बेकरी की वेबसाइट, जहाँ लोग मेन्यू देख सकें'
    : 'जैसे खर्च लिखने और महीने का हिसाब देखने वाला ऐप';
});
idea.addEventListener('input', () => idea.setCustomValidity(''));
studio.addEventListener('submit', event => {
  event.preventDefault();
  if (!idea.value.trim()) {
    idea.setCustomValidity('अपना project idea लिखो।');
    idea.reportValidity();
    return;
  }
  heading.textContent = studio.elements.kind.value + ' preview';

  web.hidden = studio.elements.kind.value !== 'Website';
  androidPanel.hidden = !web.hidden;
  if (web.hidden) renderAndroid(); else renderWebsite();
  studio.hidden = true;
  review.hidden = false;
  heading.focus();
});
const web = document.querySelector('#web');
const siteTitle = document.querySelector('#siteTitle');
const preview = document.querySelector('#preview');
const download = document.querySelector('#download');
let fileUrl;
function escapeText(value) {
  return value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
}
function renderWebsite() {
  const title = escapeText(siteTitle.value.trim() || 'मेरी वेबसाइट');
  const description = escapeText(idea.value.trim());
  const html = `<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>*{box-sizing:border-box}body{margin:0;background:#e5f0db;color:#173f32;font:18px/1.6 system-ui,sans-serif}main{max-width:840px;margin:auto;padding:clamp(24px,8vw,100px);overflow-wrap:anywhere}h1{font-size:clamp(30px,7vw,68px);line-height:1.12;margin:0 0 20px}p{white-space:pre-wrap;border-top:2px solid;padding-top:18px}#appTitle{width:100%;font:inherit;padding:10px}.phone{margin:14px 0;background:#fafafa;border:1px solid #bec5c0;min-height:155px;max-height:330px;overflow:auto;overflow-wrap:anywhere}.phone strong{display:block;background:#263831;color:white;padding:12px}.phone p{padding:0 14px;white-space:pre-wrap}</style><main><h1>${title}</h1><p>${description}</p></main></html>`;
  preview.srcdoc = html;
  if (fileUrl) URL.revokeObjectURL(fileUrl);
  fileUrl = URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
  download.href = fileUrl;
}
siteTitle.addEventListener('input', renderWebsite);
document.querySelector('#edit').addEventListener('click', () => {
  review.hidden = true;
  studio.hidden = false;
  idea.focus();
});
const appTitle = document.querySelector('#appTitle');
const androidPanel = document.querySelector('#androidPanel');
const enc = new TextEncoder();
// ZIP stored entries: local headers, central directory, end record.
function projectZip(files) {
  const local = [], directory = [];
  let offset = 0, directorySize = 0;
  for (const [path, content] of Object.entries(files)) {
    const name = enc.encode(path), data = enc.encode(content);
    let crc = -1;
    for (const byte of data) {
      crc ^= byte;
      for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
    }
    crc = ~crc;
    function header(central) {
      const bytes = new Uint8Array((central ? 46 : 30) + name.length);
      const view = new DataView(bytes.buffer);
      const u16 = (n,v) => view.setUint16(n,v,true);
      const u32 = (n,v) => view.setUint32(n,v,true);
      u32(0, central ? 0x02014b50 : 0x04034b50);
      if (central) { u16(4,20); u32(42,offset); }
      const shift = central ? 2 : 0;
      u16(4+shift,20); u16(12+shift,33); u32(14+shift,crc);
      u32(18+shift,data.length); u32(22+shift,data.length); u16(26+shift,name.length);
      bytes.set(name,central ? 46 : 30);
      return bytes;
    }
    const entry = header(false), record = header(true);
    local.push(entry,data); directory.push(record);
    offset += entry.length + data.length; directorySize += record.length;
  }
  const end = new Uint8Array(22), view = new DataView(end.buffer);
  view.setUint32(0,0x06054b50,true);
  view.setUint16(8,directory.length,true); view.setUint16(10,directory.length,true);
  view.setUint32(12,directorySize,true); view.setUint32(16,offset,true);
  return new Blob([...local,...directory,end],{type:'application/zip'});
}
function androidPage(title, body) {
  const art = document.querySelector('.phone svg').cloneNode(true);
  art.querySelector('#coverTitle').textContent = Array.from(title).slice(0,22).join('');
  return `<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeText(title)}</title><style>body{margin:0;padding:18px;background:#19141f;color:#f5eee7;font:18px/1.6 system-ui,sans-serif}svg{display:block;width:100%;height:auto}p{padding:0 12px;white-space:pre-wrap;overflow-wrap:anywhere}</style><main>${art.outerHTML}<p>${escapeText(body)}</p></main></html>`;
}
function androidFiles(title, body) {
