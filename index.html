<!doctype html>
<html lang="hi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Builder · Project Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#202924;font:16px/1.5 Inter,system-ui,sans-serif}main{max-width:740px;margin:auto;padding:24px 18px 64px}header{display:flex;align-items:center;gap:10px;border-bottom:1px solid #c9cdc5;padding-bottom:16px;font-weight:750}header b{background:#154b39;color:#e0ff94;border-radius:9px;padding:3px 9px}h1{font-size:clamp(32px,6vw,52px);letter-spacing:-.045em;line-height:1.15;margin:36px 0 24px}fieldset{padding:0;border:0;margin:0}legend,label[for]{display:block;font-weight:700;margin-bottom:10px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile,button,textarea{font:inherit}.tile{display:flex;flex-wrap:wrap;align-items:center;gap:8px;cursor:pointer;padding:14px;background:white;border:1px solid #bbc3ba;border-radius:12px;font-weight:650}.tile:has(:checked){background:#e2f2d7;border-color:#266146}input{accent-color:#215c42}.off{cursor:default;color:#646b64;background:#eeeee8}.off small{font-size:12px}section{background:white;border:1px solid #c9cdc5;border-radius:18px;padding:22px;margin-top:22px}textarea{width:100%;min-height:125px;padding:12px;border:1px solid #919c92;border-radius:9px;resize:vertical}button{margin-top:12px;background:#174e39;color:white;border:none;border-radius:9px;padding:12px 18px;cursor:pointer;font-weight:650}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a65c00;outline-offset:2px}h2{margin:0 0 12px}.idea{white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:#58635b;font-size:14px}@media(max-width:550px){.choices{grid-template-columns:1fr}.off small{margin-left:auto}}
</style>
<main><header><b aria-hidden="true">✳</b> AI Builder</header>
<h1>क्या बनाना चाहते हो?</h1>
<form id="studio"><fieldset><legend>Project चुनो</legend><div class="choices">
<label class="tile"><input name="kind" type="radio" value="Website" checked>Website बनाओ</label>
<label class="tile"><input name="kind" type="radio" value="Android App">Android App बनाओ</label>
<label class="tile off"><input type="radio" disabled>Agent Builder <small>Coming Soon</small></label>
</div></fieldset><section><label for="idea">अपना idea लिखो</label>
<textarea id="idea" required maxlength="4000" placeholder="जैसे मेरी बेकरी की वेबसाइट, जहाँ लोग मेन्यू देख सकें"></textarea>
<p class="hint">अगली स्क्रीन पर अपना project brief देखो।</p><button>Brief देखो →</button></section></form>
<section id="review" hidden><h2 tabindex="-1" id="heading"></h2><p class="idea" id="summary"></p><button id="edit">← Idea बदलो</button></section></main>
<script>
const studio = document.querySelector('#studio');
const idea = document.querySelector('#idea');
const review = document.querySelector('#review');
const heading = document.querySelector('#heading');
studio.addEventListener('change', () => {
  idea.placeholder = studio.elements.kind.value === 'Website'
    ? 'जैसे मेरी बेकरी की वेबसाइट, जहाँ लोग मेन्यू देख सकें'
    : 'जैसे खर्च लिखने और महीने का हिसाब देखने वाला ऐप';
});
idea.addEventListener('input', () => idea.setCustomValidity(''));
studio.addEventListener('submit', event => {
  event.preventDefault();
  if (!idea.value.trim()) {
    idea.setCustomValidity('अपना project idea लिखो।');
    idea.reportValidity();
    return;
  }
  heading.textContent = studio.elements.kind.value + ' का brief';
  document.querySelector('#summary').textContent = idea.value.trim();
  studio.hidden = true;
  review.hidden = false;
  heading.focus();
});
document.querySelector('#edit').addEventListener('click', () => {
  review.hidden = true;
  studio.hidden = false;
  idea.focus();
});
</script></html>
