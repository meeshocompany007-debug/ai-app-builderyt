<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171714"><title>Builder Studio</title><link rel="stylesheet" href="/builder.css"></head>
<body><header><div class="brand"><i aria-hidden="true"></i>Builder Studio</div><div class="account"><label id="projectPicker" hidden><span class="sr">Switch project</span><select id="project"></select></label><button id="signIn">Sign in</button><button id="logout" hidden>Sign out</button></div></header>
<main><div class="hero"><div class="art" aria-hidden="true"><div class="orbit"></div><div class="sculpture"><i></i><i></i><i></i></div></div><h1 id="headline">What will you<br><em>build today?</em></h1></div>
<div id="workspace"><form id="request"><label id="promptLabel" for="prompt">Your idea</label><textarea id="prompt" maxlength="8000" required placeholder="Ek app banao jisme meri team apne tasks track kar sake…"></textarea>
<div class="controls"><div class="targets" aria-label="Platform"><select id="target" aria-label="Platform"><option value="web">Web app</option><option value="android">Android</option></select><button type="button" data-platform="web" aria-pressed="true">Web app</button><button type="button" data-platform="android" aria-pressed="false">Android</button></div><button class="primary" type="submit">Run build <span aria-hidden="true">↗</span></button></div></form>
<div id="workbench" hidden><details id="logs"><summary>Build activity</summary><pre id="activity" aria-live="polite"></pre></details>
<section><nav><button data-tab="preview">Preview</button><button data-tab="source">Files</button><button data-tab="history">History</button></nav><div id="preview"><p id="empty">Waiting for the first successful build.</p><iframe hidden title="Application preview" sandbox="allow-scripts allow-forms allow-same-origin"></iframe></div><div id="source" hidden><select id="paths" aria-label="Source file"></select><pre id="code"></pre></div><div id="history" hidden></div><footer><button id="publish" disabled>Publish web</button><a id="apk" hidden>Download APK</a><a id="link" hidden target="_blank" rel="noopener">Open published app ↗</a></footer></section></div></div><p id="status" role="status"></p></main>
<dialog id="auth"><div class="dialog-head"><h2>Enter your studio</h2><button id="closeAuth" aria-label="Close">×</button></div><form id="login"><label>Username<input name="name" minlength="3" required autocomplete="username"></label><label>Password<input name="password" type="password" minlength="12" required autocomplete="current-password"></label><p role="alert" id="loginError"></p><button class="primary" value="login">Sign in</button> <button value="register">Create account</button></form></dialog>
<script type="module" src="/builder.js"></script></body></html>
