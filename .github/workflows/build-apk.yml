name: Build RewardWatch V2 APK
on:
  push:
    branches: [rewardwatch-apk-build]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check coin math
        run: |
          mkdir -p /tmp/rewardwatch-tests
          javac -d /tmp/rewardwatch-tests app/src/main/java/com/aicandy/rewardwatch/CoinRules.java tests/CoinRulesTest.java
          java -cp /tmp/rewardwatch-tests CoinRulesTest
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RewardWatch-V2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
