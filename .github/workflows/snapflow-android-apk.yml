name: SnapDay Android APK
on:
  push:
    branches:
      - feature/snapflow-android-downloader
    paths:
      - 'snapflow/**'
      - '.github/workflows/snapflow-android-apk.yml'
  pull_request:
    paths:
      - 'snapflow/**'
      - '.github/workflows/snapflow-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35 using runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo "Android cmdline tools missing"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble real Android debug APK
        working-directory: snapflow
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists and has content
        run: test -s snapflow/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapDay-debug-APK
          path: snapflow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-download-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Real video download on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            gradle -p snapflow --no-daemon :app:connectedDebugAndroidTest
            adb install -r snapflow/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.snapflow.downloader
            adb shell input keyevent 224
            adb shell wm dismiss-keyguard || true
            adb shell input keyevent 82
            adb shell am start -n com.snapflow.downloader/.SnapDayActivity --es snapday_screen home
            sleep 4
            adb shell dumpsys activity activities | grep -E "mResumed|topResumed|SnapDayActivity" | tail -8 || true
            adb logcat -d -s AndroidRuntime:E ActivityTaskManager:I | tail -70 || true
            adb exec-out screencap -p > snapflow/snapday-home-emulator.png
            test -s snapflow/snapday-home-emulator.png
            for screen in intro1 intro2 intro3 premium; do
              adb shell am force-stop com.snapflow.downloader
              adb shell am start -n com.snapflow.downloader/.SnapDayActivity --es snapday_screen "$screen"
              sleep 2
              adb exec-out screencap -p > "snapflow/snapday-$screen-emulator.png"
              test -s "snapflow/snapday-$screen-emulator.png"
            done
      - name: Upload SnapDay Home, Onboarding and Premium screenshots for UI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SnapDay-UI-screenshots
          path: snapflow/snapday-*-emulator.png
          if-no-files-found: warn
          retention-days: 14
