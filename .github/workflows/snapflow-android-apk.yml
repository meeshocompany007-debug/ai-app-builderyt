name: SnapFlow Android APK
on:
  push:
    branches:
      - feature/snapflow-android-downloader
    paths:
      - 'snapflow/**'
      - '.github/workflows/snapflow-android-apk.yml'
  pull_request:
    paths:
      - 'snapflow/**'
      - '.github/workflows/snapflow-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble real Android debug APK
        working-directory: snapflow
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists and has content
        run: test -s snapflow/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapFlow-debug-APK
          path: snapflow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
