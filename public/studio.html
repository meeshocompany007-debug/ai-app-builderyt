<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Builder · Workspace</title>
<style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:radial-gradient(ellipse at top right,#38273d,transparent 65%),#19151d;color:#f8efe8;font:16px/1.55 system-ui,sans-serif;min-height:100vh}main{max-width:930px;margin:auto;padding:24px 18px 60px}header,.actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px}header{border-bottom:1px solid #554555;padding-bottom:17px;justify-content:space-between}header strong{font-size:22px}h1{font:500 clamp(36px,7vw,66px)/1.1 Georgia,serif}section{background:#251f29;border:1px solid #524055;border-radius:18px;padding:20px;margin:18px 0}input,textarea,select{width:100%;background:#17141c;color:#fff;border:1px solid #705d75;border-radius:9px;padding:11px;font:inherit}label{display:block;margin:12px 0}textarea{min-height:115px}button,.link{font:inherit;font-weight:650;cursor:pointer;border:0;border-radius:10px;padding:10px 15px;color:#271c24;background:#ffd1ac;text-decoration:none}.soft{color:#efdeef;background:#443647}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #baa3ff}iframe{width:100%;height:440px;border:0;background:white;border-radius:12px}#list{display:flex;gap:8px;flex-wrap:wrap}#msg{min-height:1.5em;color:#ffdbaf}small{color:#cfbdce}</style>
<main><header><strong>✦ AI Builder</strong><button hidden class="soft" id="logout">Sign out</button></header><h1>Project Studio</h1><p id="msg" role="status"></p>
<section id="auth" hidden><h2>अपना workspace खोलो</h2><form id="login" method="post"><label>Username<input name="name" autocomplete="username" minlength="3" maxlength="40" required></label><label>Password · कम से कम 12 अक्षर<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><div class="actions"><button value="login">Login</button><button class="soft" value="register">Account बनाओ</button></div></form></section>
<div id="workspace" hidden><section><div class="actions"><h2>मेरे projects</h2><button id="fresh" class="soft">+ नया project</button></div><div id="list"></div></section>
<section><form id="editor"><label>क्या बनाना है?<select id="kind"><option>Website</option><option>Android App</option><option disabled>Agent Builder · Coming Soon</option></select></label><label>Project idea या बदलाव<textarea id="prompt" required maxlength="4000"></textarea></label><div id="questions" hidden aria-live="polite"></div><div class="actions"><button value="starter">Starter सेव करो</button><button value="ai" id="ai" class="soft">AI से बनाओ</button></div><small id="availability"></small></form></section>
<section id="result" hidden><h2 id="name"></h2><label>सेव किया हुआ version<select id="versions"></select></label><iframe sandbox="allow-scripts" id="preview" title="Project preview"></iframe><div class="actions"><a id="html" class="link" download>HTML डाउनलोड</a><a id="zip" class="link" download>Android source ZIP</a><button id="apk">Debug APK बनाओ</button></div></section></div></main><script type="module" src="/studio.js"></script></html>
