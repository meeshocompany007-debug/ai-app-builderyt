<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin settings · AI Candy Studio</title>
<style>*{box-sizing:border-box}[hidden]{display:none!important}body{font:16px/1.5 system-ui;background:#faf8ff;color:#252039;margin:auto;max-width:900px;padding:24px}header,section,.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}section,fieldset{background:white;border:1px solid #dad5e7;border-radius:12px;padding:16px;margin:16px 0}section{display:block}label{display:block;margin:8px 0}input,select,button,a.action{font:inherit;padding:9px;border-radius:7px;border:1px solid #aaa1bc;max-width:100%}button,a.action{background:#5336af;color:white;text-decoration:none;cursor:pointer}.row>*{flex:1;min-width:115px}h2{font-size:20px}#status{color:#583697}</style>
<header><strong>AI Candy Studio</strong><a href="/studio">Project studio</a></header><h1>Admin settings</h1>
<div id="login"><a class="action" href="/admin/signin">Sign in with Google</a></div><p role="status" id="status"></p>

<section><h2>Automatic routing</h2><div class="row"><label>Planning and fast edits <select id="fast"></select></label><label>Complex builds <select id="advanced"></select></label></div></section>
<section><h2>Builder controls</h2><label><input type="checkbox" id="ai"> Enable AI</label><label><input type="checkbox" id="apk"> Allow Android APK builds</label><label>Daily AI call limit <input id="dailyLimit" type="number" min="0" max="100000" required></label><small>Server keys, host limits and Android worker availability also apply.</small></section>
<button>Save settings</button> <button type="button" id="logout">Sign out of admin</button></form><script type="module" src="/admin.js"></script></html>
